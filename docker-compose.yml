# docker compose up -d --build
# Settings come from a .env file next to this one (see .env.example) or from the environment.
services:
  checkin:
    build: .
    image: check-in-api:latest
    container_name: check-in
    restart: unless-stopped
    init: true                 # forwards SIGTERM so pending writes are flushed on stop
    stop_grace_period: 20s
    ports:
      - "${PUBLISH_PORT:-3000}:3000"
      # Built-in HTTPS (only used when turned on in Admin → HTTPS), e.g. PUBLISH_HTTPS_PORT=443
      - "${PUBLISH_HTTPS_PORT:-3443}:3443"
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed inside the container; change the published port above instead.
      HOST: 0.0.0.0
      PORT: 3000
      HTTPS_PORT: 3443
      APPRISE_URL: ${APPRISE_URL:-http://apprise:8000}
      DB_PATH: /app/data/checkin.db
    volumes:
      # Use a named volume (not a Windows folder bind mount): SQLite's WAL locking
      # is unreliable on bind-mounted host folders under Docker Desktop.
      - checkin-data:/app/data
    # Run exactly ONE replica: SQLite is a single-writer, file-based database.
    # deploy:
    #   replicas: 1

  # Optional: alerts for new issues. Idle until you turn on Settings -> Alerts (address http://apprise:8000).
  # Check-In works the same without it: delete this service to remove it.
  apprise:
    image: caronc/apprise:latest
    container_name: apprise
    restart: unless-stopped
    # Not published: only Check-In needs to reach it. Uncomment to open its own web UI on this machine.
    # ports: ["127.0.0.1:8000:8000"]
    volumes:
      - apprise-config:/config

volumes:
  checkin-data:
  apprise-config:
