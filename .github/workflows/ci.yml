name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t check-in-api:ci .
      - name: Smoke test
        run: |
          docker run -d --name ci -p 3000:3000 check-in-api:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/health && break; sleep 1; done
          curl -fs -X POST "http://localhost:3000/api/checkin?id=ci-1&status=ok"
          docker logs ci
          docker rm -f ci
