name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
      - '.dockerignore'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t check-in-api:ci .
      - name: Smoke test
        run: |
          # Check-ins need an API key now, so start the container with a known one and send it.
          docker run -d --name ci -p 3000:3000 -e API_KEY=ci-smoke-key-1234567890abcd check-in-api:ci
          for i in $(seq 1 30); do curl -fs http://localhost:3000/health && break; sleep 1; done
          echo
          # Without the key a check-in must be refused; with it, accepted (-S shows the reason if it fails).
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST 'http://localhost:3000/api/checkin?id=ci-1&status=ok')" = 401
          curl -fsS -X POST -H 'X-API-Key: ci-smoke-key-1234567890abcd' 'http://localhost:3000/api/checkin?id=ci-1&status=ok' || { docker logs ci; docker rm -f ci; exit 1; }
          echo
          docker logs ci
          docker rm -f ci